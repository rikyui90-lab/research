name: 株価ページの自動更新

on:
  # 不祥事銘柄のページを一時的に公開から外したため(2026-10-20)、毎日の自動更新を止めている。
  # 公開に戻すときは、_config.yml の exclude を消して、下の schedule を戻す。
  # schedule:
  #   # 平日の16:30(日本時間)。東証の引け(15:30)のあと。cron は UTC なので 07:30
  #   - cron: "30 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 株価を取得してページを作り直す
        env:
          PYTHONIOENCODING: utf-8
        run: python .claude/skills/fushoji-page/scripts/build_pages.py fushoji/companies.json fushoji

      - name: 変更があればコミットして push する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fushoji
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "株価を自動更新 $(date -u +%F)"
            git push
          fi
