<style>
  /* レイアウト: 上に全社の騰落率の比較、その下に会社ごとのカード(事案の説明、日足チャート、数値) */
  :root {
    --bg: #f1f3f6;
    --surface: #fcfcfd;
    --ink: #14171c;
    --ink-2: #4a5160;
    --ink-3: #6f7686;
    --line: #dde1e8;
    --grid: #e7eaf0;
    --series: #2a78d6;
    --series-soft: rgba(42, 120, 214, 0.12);
    --pre: #9aa1b0;
    --chip: #e8ecf3;
    --company: #d12a2a;
    --font-body: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
    --font-head: "Zen Kaku Gothic New", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1014;
      --surface: #171a20;
      --ink: #f0f2f5;
      --ink-2: #b6bcc9;
      --ink-3: #8b92a1;
      --line: #2a2e37;
      --grid: #232730;
      --series: #3987e5;
      --series-soft: rgba(57, 135, 229, 0.16);
      --pre: #6a7180;
      --chip: #232730;
      --company: #ff6b6b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1014;
    --surface: #171a20;
    --ink: #f0f2f5;
    --ink-2: #b6bcc9;
    --ink-3: #8b92a1;
    --line: #2a2e37;
    --grid: #232730;
    --series: #3987e5;
    --series-soft: rgba(57, 135, 229, 0.16);
    --pre: #6a7180;
    --chip: #232730;
    --company: #ff6b6b;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 15px/1.7 var(--font-body);
    padding-inline: 16px;
    padding-block: 32px 56px;
  }
  .wrap { max-width: 1120px; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; }
  h1, h2, h3 { font-family: var(--font-head); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
  p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }

  .top { display: flex; flex-direction: column; gap: 10px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.08em; color: var(--ink-3); }
  h1 { font-size: clamp(26px, 4.2vw, 38px); line-height: 1.25; }
  .lead { color: var(--ink-2); max-width: 62ch; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .controls .label { font-size: 13px; color: var(--ink-3); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button {
    font: 500 13px/1 var(--font-body); color: var(--ink-2); background: transparent;
    border: 0; padding: 9px 14px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--series); color: #fff; }
  .seg button:focus-visible { outline: 2px solid var(--series); outline-offset: -2px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .panel > h2 { font-size: 18px; }
  .panel > .sub { color: var(--ink-3); font-size: 13px; margin-top: 2px; }

  /* 比較バー */
  .bars { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .brow { display: grid; grid-template-columns: minmax(96px, 168px) 1fr; gap: 12px; align-items: center; }
  .bname { font-size: 13.5px; line-height: 1.35; min-width: 0; color: var(--company); }
  .bname small { display: block; color: var(--ink-3); font-size: 11.5px; }
  .btrack { position: relative; height: 26px; margin-inline: 76px; }
  .bzero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); opacity: 0.55; }
  .bbar { position: absolute; top: 3px; height: 20px; background: var(--series); border-radius: 4px; }
  .bbar.neg { border-radius: 4px 0 0 4px; }
  .bbar.pos { border-radius: 0 4px 4px 0; }
  .bval.l { transform: none; }
  .bval { position: absolute; top: 0; line-height: 26px; font-size: 13px; font-weight: 500; white-space: nowrap; }

  /* カード */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 20px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card h3 { font-size: 19px; line-height: 1.35; color: var(--company); }
  .head { display: flex; flex-direction: column; gap: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; line-height: 1; padding: 6px 9px; border-radius: 6px; background: var(--chip); color: var(--ink-2); }
  .tag.code { font-weight: 700; color: var(--ink); }
  .when { font-size: 12.5px; color: var(--ink-3); }
  .body { font-size: 14px; color: var(--ink-2); }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: var(--font-body); }
  .tip {
    position: absolute; pointer-events: none; z-index: 2; min-width: 124px;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.5;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
  }
  .tip b { font-weight: 700; }
  .tip .m { color: var(--ink-3); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
  .stat { min-width: 0; }
  .stat .k { font-size: 11.5px; color: var(--ink-3); }
  .stat .v { font-size: 17px; font-weight: 700; line-height: 1.4; }
  .stat .d { font-size: 11.5px; color: var(--ink-3); }
  .notes { display: flex; flex-direction: column; gap: 6px; }
  .note { font-size: 12.5px; color: var(--ink-2); padding: 8px 10px; border-radius: 8px; background: var(--chip); }

  details { font-size: 13px; }
  summary { cursor: pointer; color: var(--ink-2); width: fit-content; }
  summary:focus-visible { outline: 2px solid var(--series); outline-offset: 2px; border-radius: 4px; }
  .tablewrap { overflow-x: auto; margin-top: 8px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font-weight: 500; color: var(--ink-3); }
  tr.evrow td { font-weight: 700; }

  .navrow { display: flex; flex-wrap: wrap; gap: 4px 20px; }
  .back[hidden] { display: none; }
  .back { font-size: 13px; color: var(--ink-2); width: fit-content; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .src { font-size: 12px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .src a { color: var(--ink-2); }
  .foot { color: var(--ink-3); font-size: 12.5px; display: flex; flex-direction: column; gap: 4px; }

  @media (max-width: 520px) {
    .panel, .card { padding: 16px; }
    .brow { grid-template-columns: 1fr; gap: 4px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

const money = (v, cur) =>
  cur === 'USD'
    ? '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    : v.toLocaleString('ja-JP', { maximumFractionDigits: 1 }) + '円';

  cur === 'USD' ? v.toFixed(0) : v.toLocaleString('ja-JP', { maximumFractionDigits: 0 });

const pctText = (p) => (p > 0 ? '▲ +' : p < 0 ? '▼ −' : '') + Math.abs(p).toFixed(1) + '%';
const pctPlain = (p) => (p > 0 ? '+' : p < 0 ? '−' : '') + Math.abs(p).toFixed(1) + '%';

function metrics(s) {
  const rows = s.rows;
  const idx = rows.findIndex((r) => r[0] >= s.eventDate);
  const base = rows[idx - 1];
  const last = rows[rows.length - 1];
  let prior = null;
  for (let i = Math.max(1, idx - 5); i < idx; i++) {
    const p = (rows[i][1] / rows[i - 1][1] - 1) * 100;
    if (Math.abs(p) >= 10 && (!prior || Math.abs(p) > Math.abs(prior.p))) prior = { d: rows[i][0], p };
  }
  // 発生日以降で、基準(発生前日の終値)に対して最も上がった日と最も下がった日
  let up = null;
  let down = null;
  for (let i = idx; i < rows.length; i++) {
    const p = (rows[i][1] / base[1] - 1) * 100;
    if (!up || p > up.p) up = { d: rows[i][0], p, v: rows[i][1] };
    if (!down || p < down.p) down = { d: rows[i][0], p, v: rows[i][1] };
  }
  if (up.p <= 0) up = null;
  if (down.p >= 0) down = null;
  // 発生日そのものが最大になった場合は表示しない(ev フラグで判別する)
  if (up && up.d === rows[idx][0]) up.ev = true;
  if (down && down.d === rows[idx][0]) down.ev = true;
  return { idx, base, last, pct: (last[1] / base[1] - 1) * 100, post: rows.length - idx, prior, up, down };
}

/* カード */
function cardHtml(s) {
  const m = s.m;
  const tags = [`<span class="tag code">${s.code} · ${s.market}</span>`, ...s.tags.map((t) => `<span class="tag">${t}</span>`)].join('');
  const notes = [...s.notes];
  if (m.prior) notes.unshift(`発生日の前の5営業日に、${mdw(m.prior.d)}の終値が前日比 ${pctPlain(m.prior.p)} と大きく動いています。発生日を基準にした騰落率には、この動きが含まれていません。`);
  const tbl = s.rows.slice(Math.max(0, m.idx - 3)).map((r, i, arr) => {
      const gi = Math.max(0, m.idx - 3) + i;
      const prev = gi > 0 ? s.rows[gi - 1][1] : null;
      const day = prev ? pctPlain((r[1] / prev - 1) * 100) : '—';
      const vb = pctPlain((r[1] / m.base[1] - 1) * 100);
      return `<tr class="${r[0] === s.eventDate ? 'evrow' : ''}"><td>${mdw(r[0])}${r[0] === s.eventDate ? ' 発生日' : ''}</td><td>${money(r[1], s.cur)}</td><td>${day}</td><td>${gi >= m.idx ? vb : '—'}</td></tr>`;
    }).join('');
  return `<article class="card" id="c-${s.id}">
    <div class="head"><h3>${s.name}</h3><div class="tags">${tags}</div><div class="when">発生・発表: ${s.eventLabel}</div></div>
    <p class="body">${s.body}</p>
    <div class="chart" data-id="${s.id}"></div>
    <div class="stats">
      <div class="stat"><div class="k">基準の終値</div><div class="v num">${money(m.base[1], s.cur)}</div><div class="d">${mdw(m.base[0])}</div></div>
      <div class="stat"><div class="k">最新の終値</div><div class="v num">${money(m.last[1], s.cur)}</div><div class="d">${mdw(m.last[0])}</div></div>
      <div class="stat"><div class="k">基準からの騰落率</div><div class="v num">${pctText(m.pct)}</div><div class="d">発生後 ${m.post} 営業日</div></div>
    </div>
    ${notes.length ? `<div class="notes">${notes.map((n) => `<p class="note">${n}</p>`).join('')}</div>` : ''}
    ${(s.sources || []).length ? `<div class="src"><span>出典:</span>${s.sources.map((x) => `<a href="${x.url}" target="_blank" rel="noopener noreferrer">${x.label}</a>`).join('')}</div>` : ''}
    <details><summary>日次の終値を表で見る</summary><div class="tablewrap"><table><thead><tr><th>日付</th><th>終値</th><th>前日比</th><th>基準比</th></tr></thead><tbody>${tbl}</tbody></table></div></details>
  </article>`;
}

/* チャート */
let range = '3m';
const RANGE_M = { '1m': 1, '3m': 3, '6m': 6, '1y': 12 };
function pickRows(s) {
  const rows = s.rows;
  const last = new Date(rows[rows.length - 1][0]);
  const cut = new Date(last.getFullYear(), last.getMonth() - RANGE_M[range], last.getDate());
  const cutStr = `${cut.getFullYear()}-${String(cut.getMonth() + 1).padStart(2, '0')}-${String(cut.getDate()).padStart(2, '0')}`;
  let start = rows.findIndex((r) => r[0] >= cutStr);
  if (start < 0) start = 0;
  // 基準日の5営業日前までは必ず含める(古い事案でも発生前の動きが見える)
  start = Math.min(start, Math.max(0, s.m.idx - 1 - 5));
  return rows.slice(start);
}
function niceTicks(lo, hi, n) {
  const span = hi - lo;
  const raw = span / n;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / pow;
  const step = (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * pow;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}

function drawChart(el) {
  const s = STOCKS.find((x) => x.id === el.dataset.id);
  const rows = pickRows(s);
  const W = Math.max(280, el.clientWidth);
  const H = W < 420 ? 230 : 250;
  const m = { l: 44, r: 62, t: 22, b: 26 };
  const pw = W - m.l - m.r;
  const ph = H - m.t - m.b;
  const vals = rows.map((r) => r[1]);
  const baseV = s.m.base[1];
  let lo = Math.min(...vals, baseV);
  let hi = Math.max(...vals, baseV);
  const pad = (hi - lo || hi * 0.02) * 0.1;
  lo -= pad;
  hi += pad;
  const x = (i) => m.l + (rows.length === 1 ? pw / 2 : (i / (rows.length - 1)) * pw);
  const y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * ph;
  const evI = rows.findIndex((r) => r[0] >= s.eventDate);
  const baseI = evI - 1;
  const pts = rows.map((r, i) => [x(i), y(r[1])]);
  const path = (a, b) => pts.slice(a, b + 1).map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');

  const ticks = niceTicks(lo, hi, 3);
  const grid = ticks.map((t) => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/><text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)" class="num">${axisNum(t, s.cur)}</text>`).join('');

  // x 軸: 約5個の日付
  const nx = W < 420 ? 4 : 6;
  const xl = [];
  for (let k = 0; k < nx; k++) xl.push(Math.round((k / (nx - 1)) * (rows.length - 1)));
  const xlab = [...new Set(xl)].map((i, k, a) => `<text x="${x(i)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === a.length - 1 ? 'end' : 'middle'}" font-size="11" fill="var(--ink-3)" class="num">${md(rows[i][0])}</text>`).join('');

  const baseY = y(baseV);
  const lastP = pts[pts.length - 1];
  const lastY = lastP[1];
  const gap = lastY - baseY;
  // 基準ラベルと最新ラベルが重ならないようにずらす
  const baseLabY = Math.abs(gap) < 16 ? baseY + (gap >= 0 ? -9 : 15) : baseY + 4;
  const baseLine = `<line x1="${m.l}" x2="${W - m.r}" y1="${baseY}" y2="${baseY}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/><text x="${W - m.r + 6}" y="${baseLabY}" font-size="10.5" fill="var(--ink-3)">基準</text>`;

  let ev = '';
  if (evI >= 0) {
    const ex = pts[evI][0];
    const anchor = ex > W - m.r - 70 ? 'end' : 'start';
    const tx = anchor === 'end' ? ex - 6 : ex + 6;
    ev = `<line x1="${ex}" x2="${ex}" y1="${m.t - 4}" y2="${H - m.b}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${tx}" y="${m.t + 6}" text-anchor="${anchor}" font-size="11.5" font-weight="700" fill="var(--ink)" stroke="var(--surface)" stroke-width="4" paint-order="stroke" stroke-linejoin="round">発生 ${md(s.eventDate)}</text>`;
  }
  const preSeg = baseI >= 1 ? `<path d="${path(0, baseI)}" fill="none" stroke="var(--pre)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : '';
  const postFrom = Math.max(0, baseI);
  const area = `<path d="${path(postFrom, rows.length - 1)} L${lastP[0].toFixed(1)} ${H - m.b} L${pts[postFrom][0].toFixed(1)} ${H - m.b} Z" fill="var(--series-soft)"/>`;
  const postSeg = `<path d="${path(postFrom, rows.length - 1)}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const end = `<circle cx="${lastP[0]}" cy="${lastY}" r="4.5" fill="var(--series)" stroke="var(--surface)" stroke-width="2"/><text x="${lastP[0] + 9}" y="${lastY + 4}" font-size="12" font-weight="700" fill="var(--ink)" class="num">${endNum(rows[rows.length - 1][1], s.cur)}</text>`;

  // 発生日以降の最大上昇日・最大下落日(基準比)を点とラベルで示す
  const mark = (e, isUp) => {
    if (!e || e.ev) return '';
    const i = rows.findIndex((r) => r[0] === e.d);
    if (i < 0) return '';
    const [px, py] = pts[i];
    const anchor = px > W - m.r - 90 ? 'end' : px < m.l + 90 ? 'start' : 'middle';
    const ly = Math.min(H - m.b - 4, Math.max(m.t + 28, isUp ? py - 10 : py + 18));
    return `<circle cx="${px}" cy="${py}" r="5" fill="${isUp ? '#e5322d' : '#000'}" stroke="var(--surface)" stroke-width="2"/><text x="${px}" y="${ly}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="var(--ink)" stroke="var(--surface)" stroke-width="4" paint-order="stroke" stroke-linejoin="round" class="num">${isUp ? '▲ 最大上昇' : '▼ 最大下落'} ${md(e.d)} ${money(e.v, s.cur)}</text>`;
  };
  const marks = mark(s.m.up, true) + mark(s.m.down, false);

  const label = `${s.name}の日足終値。${md(rows[0][0])}から${md(rows[rows.length - 1][0])}まで。発生日前日の終値${money(baseV, s.cur)}に対して最新は${pctPlain(s.m.pct)}。${s.m.up && !s.m.up.ev ? `発生日以降の最大上昇は${md(s.m.up.d)}の${money(s.m.up.v, s.cur)}。` : ''}${s.m.down && !s.m.down.ev ? `最大下落は${md(s.m.down.d)}の${money(s.m.down.v, s.cur)}。` : ''}`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${grid}${xlab}${baseLine}${area}${preSeg}${postSeg}${ev}${marks}${end}<g class="hov" style="display:none"><line y1="${m.t}" y2="${H - m.b}" stroke="var(--ink-3)" stroke-width="1"/><circle r="4.5" fill="var(--series)" stroke="var(--surface)" stroke-width="2"/></g><rect class="hit" x="${m.l}" y="0" width="${pw}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>`;

  const svg = el.querySelector('svg');
  const hov = svg.querySelector('.hov');
  const line = hov.querySelector('line');
  const dot = hov.querySelector('circle');
  const tip = el.querySelector('.tip');
  const hit = svg.querySelector('.hit');
  const move = (e) => {
    const box = svg.getBoundingClientRect();
    const px = ((e.clientX - box.left) / box.width) * W;
    let i = Math.round(((px - m.l) / pw) * (rows.length - 1));
    i = Math.max(0, Math.min(rows.length - 1, i));
    const [cx, cy] = pts[i];
    hov.style.display = '';
    line.setAttribute('x1', cx);
    line.setAttribute('x2', cx);
    dot.setAttribute('cx', cx);
    dot.setAttribute('cy', cy);
    const vb = (rows[i][1] / baseV - 1) * 100;
    const prev = i > 0 ? (rows[i][1] / rows[i - 1][1] - 1) * 100 : null;
    tip.innerHTML = `<b>${mdw(rows[i][0])}</b>${rows[i][0] === s.eventDate ? ' <span class="m">発生日</span>' : ''}<br>終値 <b class="num">${money(rows[i][1], s.cur)}</b><br><span class="m">基準比</span> <span class="num">${pctPlain(vb)}</span>${prev === null ? '' : `<br><span class="m">前日比</span> <span class="num">${pctPlain(prev)}</span>`}`;
    tip.hidden = false;
    const scale = box.width / W;
    const tw = tip.offsetWidth;
    let left = cx * scale + 14;
    if (left + tw > box.width) left = cx * scale - tw - 14;
    tip.style.left = Math.max(0, left) + 'px';
    tip.style.top = Math.max(0, cy * scale - tip.offsetHeight - 10) + 'px';
  };
  const leave = () => {
    hov.style.display = 'none';
    tip.hidden = true;
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', leave);
}

function drawAll() {
  document.querySelectorAll('.chart').forEach(drawChart);
}

VIEW.sort((a, b) => (a.eventDate < b.eventDate ? 1 : a.eventDate > b.eventDate ? -1 : 0));
document.getElementById('cards').innerHTML = VIEW.map(cardHtml).join('');
drawAll();
let lastW = 0;
new ResizeObserver(() => {
  const w = document.querySelector('.chart').clientWidth;
  if (w !== lastW) {
    lastW = w;
    drawAll();
  }
}).observe(document.querySelector('.chart'));

document.querySelectorAll('[data-range]').forEach((b) => {
  b.addEventListener('click', () => {
    range = b.dataset.range;
    document.querySelectorAll('[data-range]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    drawAll();
  });
});
</script>
</body></html>
