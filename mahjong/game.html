<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>麻雀 CPU対局</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 卓を囲む対局画面。迷わず遊べて、点数の理由が分かる。
   IDEA: 真上から見た全自動卓。中央の表示板と、4方向の捨て牌。
   PICTURE: 緑のラシャの正方形の卓。各家の捨て牌はその人の向きで並ぶ。
   COLOUR and TYPE: ラシャ緑 / 象牙色の牌 / 中の赤。牌と見出しは Shippori Mincho B1。
   LAYOUT: 得点板 → 卓（画面幅に合わせて縮小）→ 自分の手牌と操作 → 結果。 */
:root{color-scheme:light dark;
--bg:light-dark(#fbf8f0,#0d1613);--ink:light-dark(#17201c,#ece6d6);--mute:light-dark(#5b6660,#a6ab9f);
--felt:#0f5c45;--ivory:#f7f2e2;--red:#c8102e;--line:light-dark(#e3dccb,#25332d);
--card:light-dark(#fff,#13201b);--ui:light-dark(#7d7562,#83918a);--chip:light-dark(#efe9da,#1c2b25)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;overflow-x:clip}
h1,.t,.cl b{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
.wrap{max-width:760px;margin:0 auto;padding:16px max(4vw,12px) 40px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1;margin:8px 0}
a{color:inherit}
.back{display:inline-flex;align-items:center;min-height:44px;font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-weight:700;margin:8px 0}
.bar span{white-space:nowrap}.dora{display:flex;align-items:center;gap:6px}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:8px 0 12px}
.pl{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.pl.now{border:2px solid var(--ink)}
.pl .wd{font-weight:800;font-size:18px;min-width:1.2em}.pl .pt{font-weight:800;white-space:nowrap}
.rbadge{background:var(--red);color:#fff;border-radius:6px;padding:0 8px;font-size:14px;font-weight:700}
.tag{font-size:14px;color:var(--mute)}
/* 卓 */
.felt{max-width:600px;margin:0 auto;border-radius:22px;background:radial-gradient(70% 60% at 50% 45%,#177a5b,#0f5c45 70%,#0b4636);box-shadow:inset 0 0 0 10px #5b3a21,inset 0 0 0 13px #3e2614,0 10px 30px rgba(0,0,0,.3);padding-bottom:16px}
.tw{position:relative;width:100%;overflow:hidden;border-radius:22px 22px 0 0}
.table{position:absolute;left:0;top:0;width:600px;height:600px;transform-origin:0 0}
.area{position:absolute;width:180px;height:210px;display:flex;flex-direction:column}
.a0{left:210px;top:390px}.a2{left:210px;top:0;transform:rotate(180deg)}
.a3{left:15px;top:195px;transform:rotate(90deg)}.a1{left:405px;top:195px;transform:rotate(-90deg)}
.area .riv{display:flex;flex-wrap:wrap;align-content:flex-start;gap:1px 2px;padding:6px 3px 0;width:180px}
.corner{position:absolute;width:190px;height:190px;display:flex;flex-wrap:wrap;justify-content:flex-end;align-content:flex-end;gap:4px;padding:18px}
.k0{display:none}.k2{left:0;top:0;transform:rotate(180deg)}.k3{left:0;bottom:0;transform:rotate(90deg)}.k1{right:0;top:0;transform:rotate(-90deg)}
.center{position:absolute;left:210px;top:210px;width:180px;height:180px;border-radius:14px;background:#0a3b2d;box-shadow:inset 0 2px 8px rgba(0,0,0,.5);color:#e9f1ec}
.cl{position:absolute;left:50%;top:50%;width:150px;display:flex;justify-content:center;align-items:center;gap:8px;font-weight:700;font-size:15px}
.cl b{font-size:22px;color:#e9f1ec}.cl.now b{color:#ffd43b}
.c0{transform:translate(-50%,-50%) translateY(66px)}.c1{transform:translate(-50%,-50%) rotate(-90deg) translateY(66px)}
.c2{transform:translate(-50%,-50%) rotate(180deg) translateY(66px)}.c3{transform:translate(-50%,-50%) rotate(90deg) translateY(66px)}
.stick{display:inline-block;width:34px;height:6px;border-radius:3px;background:#fff;position:relative}.stick::after{content:"";position:absolute;left:14px;top:0;width:6px;height:6px;border-radius:50%;background:var(--red)}
.cm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:14px;line-height:1.4;width:96px}
.cm .rd{font-weight:800;font-size:16px}
/* 牌 */
.tiles{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end}
.t{--w:28px;width:var(--w);height:calc(var(--w)*1.36);border-radius:calc(var(--w)*.14);background:linear-gradient(#fffdf5,var(--ivory) 70%,#e7dfc6);
 box-shadow:0 calc(var(--w)*.12) 0 #1d7a5c,0 calc(var(--w)*.16) 0 #0d4a37,0 calc(var(--w)*.2) 5px rgba(0,0,0,.3);margin-bottom:calc(var(--w)*.2);
 display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-weight:800;color:#1b1b1b;user-select:none;flex:none}
.t b{font-size:calc(var(--w)*.5)}.t i{font-style:normal;font-size:calc(var(--w)*.34);margin-top:2px}
.t.m i{color:var(--red)}.t.z b{font-size:calc(var(--w)*.62)}.t.e b{color:#1d2a44}.t.g b{color:#13804f}.t.r b{color:var(--red)}
.t.w b{width:60%;height:62%;border:2px solid #4f7fc4;border-radius:3px}
.t svg{width:86%;height:86%;display:block}
.t.sm{--w:22px}.t.rv{--w:26px}
.t.rii{transform:rotate(90deg);margin:0 5px}.t.last{outline:3px solid #ffd43b;outline-offset:1px}.t.called{opacity:.35}
.t.win{outline:3px solid #e2a300;outline-offset:1px}.t.back{background:linear-gradient(#2a8a68,#1d7a5c)}.t.back>*{visibility:hidden}
.meld{display:inline-flex;gap:2px;align-items:flex-end}
button.t{border:0;padding:0;cursor:pointer;font:inherit;transition:transform .12s}button.t:hover:not(:disabled){transform:translateY(-5px)}
button.t:disabled{cursor:default}
.hand{--w:clamp(33px,6.4vw,37px);margin:0;padding:4px 18px 0;justify-content:center;min-height:70px}
.hand .meld{margin-left:12px}.hand .t{--w:inherit}.hand .meld .t{--w:calc(var(--w)*.8)}
.t.drawn{margin-left:12px}
/* 操作 */
.ctrl{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ctrl button,.btn{font:inherit;font-size:16px;min-height:44px;border-radius:10px;border:1px solid var(--ui);background:var(--chip);color:var(--ink);padding:0 14px;cursor:pointer}
.ctrl button[aria-pressed=true]{background:var(--felt);color:#fff;border-color:var(--felt)}
.btn{background:var(--felt);color:#fff;border-color:var(--felt);font-weight:700}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #000;outline-offset:3px;box-shadow:0 0 0 3px #ffd43b}
#mMsg{font-weight:700;margin:6px 0 0;min-height:1.6em;color:#f3efe2;text-align:center;padding:0 18px}
.acts{justify-content:center;min-height:52px;margin:4px 0;padding:0 18px}
.felt .ctrl button{background:#f7f2e2;color:#17201c;border:2px solid #3e2614;font-weight:700}
.felt .ctrl .btn{background:#ffd43b;color:#17201c;border-color:#17201c}
.felt .ctrl button[aria-pressed=true]{background:#c8102e;color:#fff;border-color:#fff}
.felt button:focus-visible{outline:3px solid #000;outline-offset:2px;box-shadow:0 0 0 6px #ffd43b}
.adv{border:2px solid #e2a300;background:light-dark(#fff8e1,#2a2410);border-radius:12px;padding:12px 14px;margin:10px 0}.adv p{margin:4px 0}.adv .hd{font-size:18px}
.adv table{border-collapse:collapse;margin-top:6px;font-size:16px}.adv td{padding:2px 12px 2px 0;white-space:nowrap}
.t.rec{outline:4px solid #e2a300;outline-offset:2px}.rtag{display:block;text-align:center;font-size:13px;font-weight:700;color:#8a5a00}
.mres{background:var(--chip);border-radius:12px;padding:14px;margin-top:12px}
.verd{font-size:20px;font-weight:800;margin:4px 0}
.note{font-size:14px;color:var(--mute)}
details{margin:10px 0}summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:700}
.hrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:6px 0}.hrow>span:first-child{min-width:5em;font-weight:700}
ruby{ruby-position:over}rt{font-size:13px;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-weight:600;letter-spacing:0}
.lbl{font-weight:700;margin-top:18px}
@media(max-width:600px){.board{grid-template-columns:minmax(0,1fr)}.pl{padding:4px 10px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>麻雀 CPU対局</h1><a class="back" href="./">← メニューへ</a></header>
<div class="bar" id="mInfo" aria-live="polite"></div>
<div class="board" id="mBoard"></div>
<div class="ctrl"><button id="mBeg" aria-pressed="true">初心者モード（アドバイス）：オン</button></div>
<div class="felt"><div class="tw" id="tw"><div class="table" id="tbl" role="img" aria-label="卓。中央の表示と、4人の捨て牌">
 <div class="area a2"><div class="riv" id="r2"></div></div><div class="area a3"><div class="riv" id="r3"></div></div>
 <div class="area a1"><div class="riv" id="r1"></div></div><div class="area a0"><div class="riv" id="r0"></div></div>
 <div class="corner k2" id="k2"></div><div class="corner k3" id="k3"></div><div class="corner k1" id="k1"></div><div class="corner k0" id="k0"></div>
 <div class="center" id="ctr"></div>
</div></div>
<p id="mMsg" aria-live="polite"></p>
<div class="ctrl acts" id="mAct"></div>
<div class="tiles hand" id="mHand" aria-label="あなたの手牌"></div>
</div>
<div id="mAdv" aria-live="polite"></div>
<div id="mRes" aria-live="polite"></div>
<div class="lbl">対局の長さ</div>
<div class="ctrl" id="mLen"></div>
<div class="ctrl"><button id="mNew">この長さで最初から対局する</button></div>
<p class="note">初心者モードをオンにすると、あなたの番に「どの牌を切るとよいか」と理由が出て、おすすめの牌が黄色い枠で光ります。鳴けるときは、鳴くべきかどうかも教えます。</p>
<p class="note">あなた（下）、下家（右）、対面（上）、上家（左）の4人で打ちます。東の席の人が親で、東場・南場を1周ずつ回るか、誰かの持ち点がマイナスになったら終わりです。鳴けるときは「ポン」「チー」「カン」のボタンが出ます（チーは上家の捨て牌だけ）。黄色い枠は直前の捨て牌、薄い牌は鳴かれた牌、横向きの牌はリーチ宣言牌です。赤ドラ、槍槓、喰い替えの制限はありません。</p>
</div>
<script>
{
const $=id=>document.getElementById(id);
const MAN='〇一二三四五六七八九',HON=['','東','南','西','北','白','發','中'],HC=['','e','e','e','e','w','g','r'];
// 筒子・索子の図柄（viewBox 30×40）
const CB='#1f4fa0',CG='#13804f',CR='#c8102e',IV='#f7f2e2';
const dot=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${x}" cy="${y}" r="${r*.58}" fill="${IV}"/><circle cx="${x}" cy="${y}" r="${r*.3}" fill="${c}"/>`;
const PIN={1:[[15,20,11,CR]],2:[[15,11,6,CG],[15,29,6,CB]],3:[[8,9,5,CB],[15,20,5,CR],[22,31,5,CG]],
 4:[[9,11,5,CB],[21,11,5,CG],[9,29,5,CG],[21,29,5,CB]],5:[[8,9,4.5,CB],[22,9,4.5,CG],[15,20,4.5,CR],[8,31,4.5,CG],[22,31,4.5,CB]],
 6:[[9,7,4.2,CG],[21,7,4.2,CG],[9,22,4.2,CR],[21,22,4.2,CR],[9,33,4.2,CR],[21,33,4.2,CR]],
 7:[[7,5,3.6,CG],[15,9,3.6,CG],[23,13,3.6,CG],[9,24,3.6,CR],[21,24,3.6,CR],[9,34,3.6,CR],[21,34,3.6,CR]],
 8:[6,15,24,33].flatMap(y=>[[9,y,4,CB],[21,y,4,CB]]),
 9:[[8,CB],[20,CR],[32,CG]].flatMap(([y,c])=>[7,15,23].map(x=>[x,y,3.7,c]))};
const stick=(x,y,h,c,a=0)=>`<g${a?` transform="rotate(${a} ${x} ${y})"`:''}><rect x="${x-1.8}" y="${y-h/2}" width="3.6" height="${h}" rx="1.6" fill="${c}"/><rect x="${x-1.8}" y="${y-.5}" width="3.6" height="1" fill="${IV}"/></g>`;
const SOU={2:[[15,11,CG],[15,29,CG]],3:[[15,11,CG],[9,29,CG],[21,29,CG]],4:[[9,11,CG],[21,11,CG],[9,29,CG],[21,29,CG]],
 5:[[8,11,CG],[22,11,CG],[15,20,CR],[8,29,CG],[22,29,CG]],6:[11,29].flatMap(y=>[7,15,23].map(x=>[x,y,CG])),
 7:[[15,7,CR,9]].concat([21,33].flatMap(y=>[7,15,23].map(x=>[x,y,CG,9]))),
 8:[[4.5,11,CG,13,0],[11.3,11,CG,13,-22],[18.7,11,CG,13,22],[25.5,11,CG,13,0],[4.5,29,CG,13,0],[11.3,29,CG,13,22],[18.7,29,CG,13,-22],[25.5,29,CG,13,0]],
 9:[7,20,33].flatMap(y=>[7,15,23].map(x=>[x,y,x===15?CR:CG,10]))};
const BIRD=`<ellipse cx="14" cy="23" rx="7" ry="9" fill="${CG}"/><path d="M8 28 L3 37 L11 31 Z M12 31 L10 39 L16 31 Z" fill="${CB}"/><circle cx="19" cy="11" r="4.5" fill="${CR}"/><path d="M23 10 L28 12 L23 13 Z" fill="#e2a300"/><circle cx="20" cy="10" r="1" fill="${IV}"/><path d="M11 19 Q15 24 12 30" stroke="${IV}" stroke-width="1.2" fill="none"/>`;
const PIC={};
const pic=(n,s)=>PIC[n+s]||(PIC[n+s]=`<svg viewBox="0 0 30 40" aria-hidden="true">${s==='p'?PIN[n].map(([x,y,r,c])=>dot(x,y,r,c)).join(''):n===1?BIRD:SOU[n].map(([x,y,c,h,a])=>stick(x,y,h||13,c,a)).join('')}</svg>`);
const tile=(n,s)=>{
 if(s==='z')return `<span class="t z ${HC[n]}" aria-label="${HON[n]}"><b>${n===5?'':HON[n]}</b></span>`;
 if(s==='m')return `<span class="t m" aria-label="${n}萬"><b>${MAN[n]}</b><i>萬</i></span>`;
 return `<span class="t ${s}" aria-label="${n}${s==='p'?'ピン':'ソー'}">${pic(n,s)}</span>`;
};
const parse=str=>{const out=[];let buf=[];for(const c of str.replace(/\s/g,'')){if(/\d/.test(c))buf.push(+c);else{buf.forEach(n=>out.push([n,c]));buf=[]}}return out};
const tiles=str=>str.split(' ').map(g=>`<span class="tiles">${parse(g).map(([n,s])=>tile(n,s)).join('')}</span>`).join('<span style="width:6px"></span>');

const Y=[
['立直','リーチ',1,0,'門前でテンパイしたら1000点を出して宣言。以後は手を変えられません。',null],
['一発','イッパツ',1,0,'リーチ後、1巡以内（間に鳴きが入らず）にアガる。',null],
['門前清自摸和','メンゼンツモ',1,0,'門前の状態で、ツモでアガる。',null],
['平和','ピンフ',1,0,'4面子すべて順子、雀頭が役牌でない、両面待ち。符がつかない形。','234m 567m 345p 678s 99s'],
['断么九','タンヤオ',1,1,'2〜8の数牌だけで作る。鳴いてもOK（喰いタン）のルールが一般的。','234m 456m 678p 345s 55s'],
['一盃口','イーペーコー',1,0,'同じ種類・同じ並びの順子を2組。','112233m 456p 789s 55s'],
['役牌','ヤクハイ',1,1,'三元牌（白發中）、場風、自風の刻子。1組につき1翻。','555z 123m 456p 789s 11p'],
['嶺上開花','リンシャンカイホー',1,1,'カンした後の補充牌（嶺上牌）でアガる。',null],
['槍槓','チャンカン',1,1,'他家が加槓した牌でロンする。',null],
['海底摸月','ハイテイ',1,1,'最後の牌をツモってアガる。',null],
['河底撈魚','ホウテイ',1,1,'最後の捨て牌でロンする。',null],
['ダブル立直','ダブリー',2,0,'最初のツモ番（鳴きが入る前）でリーチ。',null],
['七対子','チートイツ',2,0,'対子を7組。同じ牌4枚は2組と数えない。符は25符固定。','11m 33m 55p 77p 22s 66s 77z'],
['三色同順','サンショク',2,1,'萬子・筒子・索子で同じ数字の順子。','123m 123p 123s 678s 99p'],
['一気通貫','イッツー',2,1,'同じ種類で123・456・789。','123m 456m 789m 345p 22s'],
['混全帯么九','チャンタ',2,1,'すべての面子と雀頭に么九牌（1・9・字牌）を含む。','123m 789p 789s 111z 99s'],
['対々和','トイトイ',2,2,'4面子すべて刻子（槓子）。','222m 555p 888s 333z 77p'],
['三暗刻','サンアンコー',2,2,'暗刻を3組。鳴いた面子があってもOK。','222m 555p 888s 345s 77p'],
['三色同刻','サンショクドーコー',2,2,'萬子・筒子・索子で同じ数字の刻子。','333m 333p 333s 456s 88m'],
['三槓子','サンカンツ',2,2,'槓子を3組。',null],
['小三元','ショウサンゲン',2,2,'三元牌のうち2つが刻子、1つが雀頭。役牌2翻も付くので実質4翻。','555z 666z 77z 123m 456p'],
['混老頭','ホンロートー',2,2,'1・9・字牌だけで作る。対々和か七対子と複合。','111m 999p 111z 222z 99s'],
['二盃口','リャンペーコー',3,0,'一盃口を2組。七対子とは複合しない。','112233m 445566p 77s'],
['純全帯么九','ジュンチャン',3,2,'すべての面子と雀頭に1か9を含む（字牌なし）。','123m 789m 123p 999s 11s'],
['混一色','ホンイツ',3,2,'1種類の数牌と字牌だけで作る。','123m 345m 777m 222z 99m'],
['清一色','チンイツ',6,5,'1種類の数牌だけで作る。','123s 234s 456s 789s 55s'],
['国士無双','コクシムソウ',13,0,'13種類の么九牌を1枚ずつ＋そのうち1つを対子。','19m 19p 19s 1234567z 1m'],
['四暗刻','スーアンコー',13,0,'暗刻を4組。ロンで刻子が完成するとトイトイ三暗刻になる点に注意。','222m 555p 888s 333z 77p'],
['大三元','ダイサンゲン',13,13,'白・發・中すべてを刻子に。','555z 666z 777z 123m 99p'],
['字一色','ツーイーソー',13,13,'字牌だけで作る。','111z 222z 333z 555z 77z'],
['小四喜','ショウスーシー',13,13,'風牌のうち3つが刻子、1つが雀頭。','111z 222z 333z 44z 123m'],
['大四喜','ダイスーシー',13,13,'東南西北すべてを刻子に（ダブル役満のルールも）。','111z 222z 333z 444z 55m'],
['緑一色','リューイーソー',13,13,'索子の2・3・4・6・8と發だけで作る。','234s 234s 666s 888s 66z'],
['清老頭','チンロートー',13,13,'1と9の数牌だけで作る。','111m 999m 111p 999s 11s'],
['九蓮宝燈','チューレンポートー',13,0,'1種類で1112345678999＋同じ種類の牌1枚。','1112345678999m 5m'],
['四槓子','スーカンツ',13,13,'槓子を4組。',null],
['天和','テンホー',13,0,'親が配牌の時点でアガっている。',null],

 if(su.length&&su.every(u=>u===su[0])&&MT.hands[p].filter(t=>t<27&&Math.floor(t/9)!==su[0]).length<=1)return true;
 return false};
const improves=(p,used,nm)=>{const s0=shan(cnt(MT.hands[p]),K(p)),h=MT.hands[p].slice();used.forEach(t=>take(h,t,1));
 const ds=discards(cnt(h),null,K(p)+1);return ds.length&&ds[0].sh<s0};
const cpuWantPon=(q,t)=>{const c=cnt(MT.hands[q]);if(c[t]<2)return false;
 if(isYH(q,t))return true;const nm={type:'pon',t};return yakuPath(q,nm)&&improves(q,[t,t],nm)};
const cpuWantChi=(q,t)=>{for(const s of chiOpts(MT.hands[q],t)){const used=[s,s+1,s+2].filter(x=>x!==t),nm={type:'chi',t:s};
 if(yakuPath(q,nm)&&improves(q,used,nm))return s}return null};
const mCalls=(p,t)=>{if(!MT.wall.length){mNext(p);return}
 for(let k=1;k<4;k++){const q=(p+k)%4;if(q===0||MT.rii[q]>=0)continue;if(cpuWantPon(q,t)){mCall(q,{type:'pon',t},p);return}}
 if(MT.rii[0]<0&&p!==0){const c=cnt(MT.hands[0]),op=[];
  if(c[t]>=2)op.push({type:'pon',t});if(c[t]>=3&&MT.kans<4)op.push({type:'minkan',t});
  if(p===3)chiOpts(MT.hands[0],t).forEach(s=>op.push({type:'chi',t:s}));
  if(op.length){MT.phase='call';MT.pend={p,t,op};MT.msg=`${PN[p]}の ${NM(t)} を鳴けます。鳴かないときは「スルー」。`;mRender();return}}
 mChi(p,t)};
const mChi=(p,t)=>{const q=(p+1)%4;if(q!==0&&MT.rii[q]<0){const s=cpuWantChi(q,t);if(s!==null){mCall(q,{type:'chi',t:s},p);return}}mNext(p)};
const CALLN={pon:'ポン',chi:'チー',minkan:'カン'};
const mCall=(q,o,p)=>{const t=MT.riv[p][MT.riv[p].length-1];MT.called[p].push(MT.riv[p].length-1);MT.ipp=[0,0,0,0];MT.last=null;
 if(o.type==='minkan'){mKan(q,o,p);return}
 const h=MT.hands[q];
 if(o.type==='pon'){take(h,t,2);MT.melds[q].push({type:'pon',t,from:p})}
 else{[o.t,o.t+1,o.t+2].filter(x=>x!==t).forEach(x=>take(h,x,1));MT.melds[q].push({type:'chi',t:o.t,from:p})}
 MT.cur=q;MT.draw=null;MT.msg=`${PN[q]}が${CALLN[o.type]}！`;
 if(q===0){MT.phase='act';MT.canTsumo=null;
  if(!yakuPath(0,MT.melds[0][MT.melds[0].length-1]))MT.msg+=' 鳴いた手は役がないとアガれません。役牌・タンヤオ・トイトイ・ホンイツなどを目指しましょう。';
  else MT.msg+=' 捨てる牌を選んでください。';mRender();return}
 mRender();const [k]=cpuChoose(q);mLater(()=>mDiscard(q,k,false),560)};
const mWin=(w,ev,from)=>{mGen++;const oya=w===MT.dealer,hb=MT.honba,s=ev.sc,pay=[0,0,0,0];
 if(from>=0){pay[from]=s.t+300*hb}else for(let q=0;q<4;q++)if(q!==w)pay[q]=(oya?s.e:q===MT.dealer?s.o:s.k)+100*hb;
 let got=0;pay.forEach((v,q)=>{MT.pts[q]-=v;got+=v});got+=MT.kyotaku*1000;MT.pts[w]+=got;
 MT.res={type:'win',w,from,ev,got,hbp:(from>=0?300:100*3)*hb,kyo:MT.kyotaku*1000,hand:MT.hands[w].slice(),melds:MT.melds[w].slice(),riichi:MT.rii[w]>=0};MT.kyotaku=0;
 if(oya)MT.honba++;else{MT.dealer=(MT.dealer+1)%4;MT.kyoku++;MT.honba=0}
 MT.phase='end';MT.draw=null;MT.msg='';mRender()};
const mRyu=()=>{mGen++;const ten=[0,1,2,3].map(p=>shan(cnt(MT.hands[p]),K(p))===0),nt=ten.filter(Boolean).length;
 if(nt&&nt<4)ten.forEach((x,p)=>MT.pts[p]+=x?3000/nt:-3000/(4-nt));
 MT.res={type:'ryu',ten};const dt=ten[MT.dealer];MT.honba++;if(!dt){MT.dealer=(MT.dealer+1)%4;MT.kyoku++}
 MT.phase='end';MT.msg='';mRender()};
const riv=p=>MT.riv[p].map((t,k)=>tileI(t,'rv'+(k===MT.rii[p]?' rii':'')+(MT.called[p].includes(k)?' called':'')+(MT.last&&MT.last[0]===p&&MT.last[1]===k?' last':''))).join('');
const meldHtml=(ms,cls='sm')=>ms.map(m=>`<span class="meld">${meldTiles(m).map((t,i)=>m.type==='ankan'&&(i===0||i===3)?tileI(t,cls+' back'):tileI(t,cls)).join('')}</span>`).join('');
const now=p=>MT.cur===p&&MT.phase!=='end';
// ===== 初心者モードのアドバイス =====
let beg=true;try{beg=localStorage.getItem('mjBeginner')!=='0'}catch(e){}
const seenCnt=()=>{const s=Array(34).fill(0);MT.riv.forEach(r=>r.forEach(t=>s[t]++));MT.dora.forEach(t=>s[t]++);MT.melds.forEach(ms=>ms.forEach(m=>meldTiles(m).forEach(t=>s[t]++)));return s};
const shTxt2=s=>s===0?'テンパイ':`${s}向聴（テンパイまであと${s}枚）`;
const advice=()=>{const none={html:'',rec:null};if(!beg)return none;
 const box=h=>`<div class="adv">${h}</div>`;
 if(MT.phase==='ron')return{html:box('<p class="hd"><b>ロンを押してアガりましょう！</b></p><p>捨てられた牌でアガリの形になり、役もあります。</p>'),rec:null};
 if(MT.phase==='call'){const t=MT.pend.t,rows=[];let good=null;
  MT.pend.op.forEach(o=>{const lab=CALLN[o.type]+(o.type==='chi'?' '+[o.t,o.t+1,o.t+2].map(NM).join(''):'');
   if(o.type==='minkan'){rows.push(`<p>「${lab}」：ドラが1つ増えますが、手は進みません。慣れるまではしなくて大丈夫です。</p>`);return}
   const used=o.type==='pon'?[t,t]:[o.t,o.t+1,o.t+2].filter(x=>x!==t),nm={type:o.type,t:o.type==='chi'?o.t:t};
   const imp=improves(0,used,nm),yk=yakuPath(0,nm),yh=o.type==='pon'&&isYH(0,t);
   let v;if(yh){v='役牌の刻子になり、1翻の役が確定します。<b>おすすめ</b>';good=good||lab}
   else if(imp&&yk){v='手が進み、役（タンヤオ・ホンイツなど）も目指せます。<b>おすすめ</b>';good=good||lab}
   else if(!yk)v='鳴くと役がなくなるおそれがあります（役がないとアガれません）。';
   else v='鳴いても手は進みません。';
   rows.push(`<p>「${lab}」：${v}</p>`)});
  const head=good?`おすすめ：<b>「${good}」</b>`:'おすすめ：<b>スルー（鳴かない）</b>';
  return{html:box(`<p class="hd">${head}</p>${rows.join('')}${good?'':'<p>鳴かずに門前のままなら、テンパイしたときにリーチができます。</p>'}`),rec:null}}
 if(!(MT.phase==='act'&&MT.cur===0))return none;
 if(MT.canTsumo)return{html:box('<p class="hd"><b>「ツモ」を押してアガりましょう！</b></p>'),rec:null};
 if(MT.rii[0]>=0)return{html:box('<p>リーチ中は手を変えられないので、引いた牌をそのまま捨てます。</p>'),rec:null};
 const k=K(0),ds=discards(cnt(handAll(0)),seenCnt(),k),th=[1,2,3].filter(q=>MT.rii[q]>=0);
 const safe=th.length?ds.filter(x=>th.every(q=>MT.riv[q].includes(x.d))):[];
 let best=ds[0],defend=false;if(th.length&&best.sh>=2&&safe.length){defend=true;best=safe[0]}
 const L=[];
 if(defend)L.push(`${th.map(q=>PN[q]).join('と')}がリーチしています。あなたはまだテンパイから遠い（${ds[0].sh}向聴）ので、無理に進めず守りましょう。<b>${NM(best.d)}</b>はリーチした人がすでに捨てた牌（現物）なので、この牌でロンされることはありません。`);
 else if(best.sh===0){L.push(`切ると<b>テンパイ</b>！待ちは ${best.ts.map(NM).join('・')}（残り${best.n}枚）です。`);
  if(MT.rmode)L.push('リーチを選びました。おすすめの牌を切ると、リーチになります。');
  else if(men(0)&&MT.pts[0]>=1000&&MT.wall.length>=4)L.push('「リーチ」を押してから切りましょう。リーチは1翻の役になるので、役がない手でもアガれるようになります。')}
 else L.push(`切ると${shTxt2(best.sh)}。次に引いて手が進む牌は ${best.ts.length}種類・${best.n}枚あります。いちばん多くの牌を待てる切り方です。`);
 if(th.length&&!defend)L.push(`リーチしている人がいます。現物（当たらない牌）：${safe.length?safe.map(x=>NM(x.d)).join('・'):'手の中にはありません'}。`);
 if(k&&!men(0)&&!yakuPath(0,MT.melds[0][k-1]))L.push('鳴いた手は役が必要です。役牌・タンヤオ・トイトイ・ホンイツなどを目指しましょう。');
 const top=[];ds.forEach(x=>{if(top.length<3&&!top.some(y=>y.d===x.d))top.push(x)});
 const tbl=defend?'':`<table aria-label="切る牌の比較">${top.map(x=>`<tr><td>${x.d===best.d?'★ ':''}${NM(x.d)}切り</td><td>${x.sh===0?'テンパイ':x.sh+'向聴'}</td><td>${x.sh===0?'待ち':'手が進む牌'} ${x.n}枚</td></tr>`).join('')}</table>`;
 return{html:box(`<p class="hd">おすすめ：<b>${NM(best.d)}</b> を切る</p>${L.map(x=>`<p>${x}</p>`).join('')}${tbl}`),rec:best.d}};
$('mBeg').onclick=e=>{beg=!beg;try{localStorage.setItem('mjBeginner',beg?'1':'0')}catch(err){}mRender()};
const mRender=()=>{
 const adv=advice();$('mAdv').innerHTML=adv.html;$('mBeg').setAttribute('aria-pressed',beg);$('mBeg').textContent='初心者モード（アドバイス）：'+(beg?'オン':'オフ');
 const recK=adv.rec===null?null:(MT.draw===adv.rec&&MT.cur===0?'d':MT.hands[0].indexOf(adv.rec));
 $('mInfo').innerHTML=`<span>${RW(MT.kyoku)} ${MT.honba}本場</span><span>供託 ${MT.kyotaku}本</span><span>山 残り${MT.wall.length}枚</span><span class="dora">ドラ表示 ${MT.dora.map(t=>tileI(t,'sm')).join('')}</span>`;
 $('mBoard').innerHTML=[2,3,1,0].map(p=>`<div class="pl${now(p)?' now':''}"><span class="wd">${WN[sw(p)]}</span><span class="nm"><b>${PN[p]}</b>${p===MT.dealer?'（親）':''}</span><span class="pt">${n(MT.pts[p])}点</span>${MT.rii[p]>=0?'<span class="rbadge">リーチ</span>':''}${now(p)&&p&&MT.phase==='wait'?'<span class="tag">考え中…</span>':''}</div>`).join('');
 [0,1,2,3].forEach(p=>{$('r'+p).innerHTML=riv(p);$('k'+p).innerHTML=meldHtml(MT.melds[p],'sm')});
 $('ctr').innerHTML=[0,1,2,3].map(p=>`<div class="cl c${p}${now(p)?' now':''}"><b>${WN[sw(p)]}</b><span>${n(MT.pts[p])}</span>${MT.rii[p]>=0?'<i class="stick"></i>':''}</div>`).join('')+
  `<div class="cm"><div class="rd">${RW(MT.kyoku)}</div><div>残り ${MT.wall.length}</div><div class="tiles" style="justify-content:center">${MT.dora.map(t=>tileI(t,'sm')).join('')}</div></div>`;
 const act=MT.phase==='act'&&MT.cur===0,ri=MT.rii[0]>=0,h=MT.hands[0],hasD=MT.draw!==null&&MT.cur===0;
 const tenOK=k=>{const a=[...h];if(hasD)a.push(MT.draw);a.splice(k==='d'?a.length-1:k,1);return shan(cnt(a),K(0))===0};
 const canR=act&&hasD&&!ri&&men(0)&&MT.pts[0]>=1000&&MT.wall.length>=4&&[...h.keys(),'d'].some(tenOK);
 const dis=k=>!act||ri||(MT.rmode&&!tenOK(k));
 $('mHand').innerHTML=h.map((t,k)=>tileI(t,k===recK?'rec':'','button',`data-k="${k}" aria-label="${NM(t)}を切る${k===recK?'（おすすめ）':''}"${dis(k)?' disabled':''}`)).join('')+
  (hasD?tileI(MT.draw,'drawn'+(recK==='d'?' rec':''),'button',`data-k="d" aria-label="ツモった${NM(MT.draw)}を切る${recK==='d'?'（おすすめ）':''}"${dis('d')?' disabled':''}`):'')+
  (K(0)?`<span class="meld" style="margin-left:14px" aria-label="鳴いた牌">${meldHtml(MT.melds[0],'')}</span>`:'');
 let b='';
 if(act&&MT.canTsumo)b+='<button class="btn" data-a="tsumo">ツモ</button>'+(ri?'<button data-a="giri">ツモ切り</button>':'');
 if(act)kanOpts(0).forEach(o=>b+=`<button data-a="kan" data-t="${o.t}" data-ty="${o.type}">カン（${o.type==='ankan'?'暗槓':'加槓'}）${NM(o.t)}</button>`);
 if(canR)b+=`<button data-a="riichi" aria-pressed="${MT.rmode}">${MT.rmode?'リーチをやめる':'リーチ'}</button>`;
 if(MT.phase==='ron')b+='<button class="btn" data-a="ron">ロン</button><button data-a="pass">見逃す</button>';
 if(MT.phase==='call')b+=MT.pend.op.map((o,i)=>`<button class="btn" data-a="call" data-i="${i}">${CALLN[o.type]}${o.type==='chi'?' '+[o.t,o.t+1,o.t+2].map(NM).join(''):''}</button>`).join('')+'<button data-a="skip">スルー</button>';
 $('mAct').innerHTML=b;
 $('mMsg').textContent=MT.rmode?'リーチ：テンパイが残る牌だけを選べます。':MT.msg||'';
 $('mRes').innerHTML=MT.phase==='end'?resHtml():'';
};
const resHtml=()=>{const r=MT.res;let x='<div class="mres">';
 if(r.type==='win'){const e=r.ev,lim=LIM(e.sc.b);
  x+=`<p class="verd">${PN[r.w]}の${r.from<0?'ツモ':'ロン'}！</p><div class="tiles">${r.hand.map(t=>tileI(t,'sm')).join('')}<span style="width:8px"></span>${tileI(e.tile,'sm win')}${meldHtml(r.melds)}</div>
  <ul>${e.yaku.map(([nm,v])=>`<li>${rb(nm)}　${v>=13?rb('役満'):v+'翻'}</li>`).join('')}</ul>
  <p><b>${e.ym?rb('役満'):`${e.han}翻${e.fu}符`}${lim?'（'+rb(lim)+'）':''}</b>　${PN[r.w]}が ${n(r.got)}点を受け取りました${r.from>=0?`（${PN[r.from]}から）`:''}。</p>${r.hbp||r.kyo?`<p class="note">内訳：アガリ ${n(r.got-r.hbp-r.kyo)}点${r.hbp?`＋積み棒 ${n(r.hbp)}点`:''}${r.kyo?`＋供託（リーチ棒） ${n(r.kyo)}点`:''}</p>`:''}`;
  if(r.riichi)x+=`<div class="note" style="display:flex;gap:6px;align-items:center">裏ドラ表示 ${MT.ura.map(t=>tileI(t,'sm')).join('')}</div>`}
 else x+=`<p class="verd">流局</p><p>${r.ten.map((v,p)=>`${PN[p]}：${v?'テンパイ':'ノーテン'}`).join('　')}</p>`;
 x+=`<details><summary>全員の手牌を見る</summary>${[1,2,3,0].map(p=>`<div class="hrow"><span>${PN[p]}</span><span class="tiles">${MT.hands[p].map(t=>tileI(t,'sm')).join('')}${meldHtml(MT.melds[p])}</span></div>`).join('')}</details>`;
 const fin=MT.kyoku>=MT.len||MT.pts.some(v=>v<0);
 if(fin){const rk=[0,1,2,3].sort((a,b)=>MT.pts[b]-MT.pts[a]||a-b);
  x+=`<p class="verd">対局終了</p><ol>${rk.map(p=>`<li>${PN[p]}　${n(MT.pts[p])}点</li>`).join('')}</ol><p><b>あなたは${rk.indexOf(0)+1}位でした。</b>${MT.pts.some(v=>v<0)?'（持ち点がマイナスになった人が出たため終了）':''}</p><button class="btn" data-a="new">もう一度対局する</button>`}
 else x+='<button class="btn" data-a="next">次の局へ</button>';
 return x+'</div>'};
$('mHand').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled||MT.phase!=='act')return;
 const k=b.dataset.k==='d'?'d':+b.dataset.k;mDiscard(0,k,MT.rmode)};
document.body.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='tsumo'&&MT.phase==='act'&&MT.canTsumo)mWin(0,MT.canTsumo,-1);
 else if(a==='giri'&&MT.phase==='act')mDiscard(0,'d',false);
 else if(a==='kan'&&MT.phase==='act'){MT.phase='wait';mKan(0,{type:b.dataset.ty,t:+b.dataset.t})}
 else if(a==='riichi'){MT.rmode=!MT.rmode;mRender()}
 else if(a==='ron'&&MT.phase==='ron')mWin(0,MT.pend.ev,MT.pend.p);
 else if(a==='pass'&&MT.phase==='ron'){MT.tf[0]=1;if(MT.rii[0]>=0)MT.pf[0]=1;const q=MT.pend;MT.phase='wait';MT.msg='見逃しました（次の自分の番までロンできません）';mRender();mRon(q.p,q.t,q.k+1)}
 else if(a==='call'&&MT.phase==='call'){const q=MT.pend;mCall(0,q.op[+b.dataset.i],q.p)}
 else if(a==='skip'&&MT.phase==='call'){const q=MT.pend;MT.phase='wait';MT.msg='';mRender();mChi(q.p,q.t)}
 else if(a==='next')mKyoku();else if(a==='new')mNewGame()});
$('mNew').onclick=mNewGame;
const fit=()=>{const w=$('tw').clientWidth,s=Math.min(1,w/600);$('tbl').style.transform=`scale(${s})`;$('tw').style.height=600*s+'px'};
new ResizeObserver(fit).observe($('tw'));fit();
mNewGame();
}
