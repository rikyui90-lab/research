<section id="game" class="band"><div class="wrap">
<h1>一人麻雀</h1>
<p class="lead">山から1枚引くたびに1枚捨てて、18巡以内にツモでアガりを目指します。東場の親（東家）として遊びます。牌を押すと、その牌を捨てます。</p>
<div class="card">
<div class="bar" aria-live="polite"><span id="gTurn"></span><span id="gShan"></span><span id="gWall"></span></div>
<div class="tiles big-t" id="gHand" style="margin:6px 0"></div>
<div class="ctrl"><button id="gHint" aria-pressed="false">ヒントを表示</button><button class="btn" id="gNew">新しく始める</button></div>
<p id="gHintTxt" hidden></p>
<div aria-live="polite"><p class="verd" id="gVerd"></p><div id="gRes"></div></div>
<div class="lbl">捨て牌</div>
<div class="tiles" id="gRiver" style="margin-top:6px;min-height:40px"></div>
<p class="note">アガリの役は、門前清自摸和・断么九・役牌・混一色・清一色・七対子・対々和の形（四暗刻）・大三元・字一色・国士無双を判定します。平和や一盃口などは判定しません。</p>
</div>
</div></section>

<footer><div class="wrap">一般的なリーチ麻雀（アリアリ）のルールに基づく内容です。連風牌の雀頭、ダブル役満、切り上げ満貫などは場のルールを確認してください。</div></footer>
