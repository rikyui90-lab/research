<h1>役クイズ</h1>

<div class="ctrl" id="yqMode"></div>
<div class="card" style="max-width:720px">
<div class="hd"><h3 id="yqNo"></h3><span class="tag" id="yqScore"></span></div>
<p id="yqQ" style="margin-top:8px;font-size:18px;font-weight:700"></p>
<div id="yqHand"></div>
<div class="opts" id="yqOpts"></div>
<div aria-live="polite" id="yqExp"></div>
<button class="btn" id="yqNext">次の問題</button>
</div>
