<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>株クイズ</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --text: #1f1f1d; --muted: #6b6a64; --border: #dcdad2;
  --accent: #185fa5; --good-bg: #eaf3de; --good: #27500a; --bad-bg: #fcebeb; --bad: #791f1f;
  --line: #185fa5; --ma-short: #d85a30; --ma-mid: #0f6e56; --ma-long: #7f77dd; --up: #d03a3a; --down: #2a6fd6; --cont: #a32d2d;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1a; --card: #262624; --text: #f1efe8; --muted: #b4b2a9; --border: #444441;
    --accent: #85b7eb; --good-bg: #173404; --good: #c0dd97; --bad-bg: #501313; --bad: #f7c1c1;
    --line: #85b7eb; --ma-short: #f0997b; --ma-mid: #5dcaa5; --ma-long: #afa9ec; --up: #f09595; --down: #85b7eb; --cont: #f09595;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.7;
  font-family: system-ui, "Hiragino Sans", "Yu Gothic", sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px; }
h1 { font-size: 22px; font-weight: 500; margin: 8px 0 4px; }
.lead, .note, .sub { color: var(--muted); font-size: 14px; margin: 4px 0 12px; }
.q { font-size: 16px; font-weight: 500; margin: 12px 0 8px; }
.stars { color: var(--accent); font-size: 13px; letter-spacing: 0.1em; white-space: nowrap; }
.head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.bar { height: 4px; background: var(--border); border-radius: 2px; margin: 6px 0 12px; }
.bar > div { height: 4px; background: var(--accent); border-radius: 2px; }
.chart { background: var(--card); border: 0.5px solid var(--border); border-radius: 8px; padding: 8px; margin-bottom: 12px; }
canvas { display: block; }
.choices { display: grid; gap: 8px; }
.sec { font-size: 14px; font-weight: 500; margin: 12px 0 6px; }
.diffs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.diffs button { text-align: center; padding: 8px 12px; min-width: 56px; }
.diffs button[aria-pressed="true"] { border: 2px solid var(--accent); padding: 7.5px 11.5px; font-weight: 600; }
.choice[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }
ul.wrong .stars { margin-right: 6px; }
button.link { background: none; border: none; color: var(--accent); text-decoration: underline; padding: 6px 0; }
button.link:hover { border: none; }
.leave { margin-bottom: 4px; }
.confirm { border: 0.5px solid var(--border); background: var(--card); border-radius: 8px; padding: 12px; margin: 4px 0 8px; }
.confirm p { margin: 0 0 8px; font-size: 14px; }
.confirm .row { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; color: var(--text); background: var(--card); border: 0.5px solid var(--border);
  border-radius: 8px; padding: 12px; text-align: left; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button small { display: block; color: var(--muted); font-size: 13px; }
button.primary { background: var(--accent); color: var(--card); text-align: center; width: 100%; margin-top: 8px; }
.result { border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.result.good { background: var(--good-bg); color: var(--good); }
.result.bad { background: var(--bad-bg); color: var(--bad); }
.result .label { margin: 0; font-size: 13px; }
.result .answer { margin: 2px 0 0; font-size: 22px; font-weight: 500; }
.result .exp { margin: 6px 0 0; font-size: 14px; }
.score { font-size: 32px; font-weight: 500; margin: 8px 0; }
ul.wrong { padding-left: 20px; font-size: 14px; }
.actions { display: grid; gap: 8px; margin-top: 12px; }
.disclaimer { max-width: 560px; margin: 0 auto; padding: 8px 16px 24px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>

// 擬似乱数(mulberry32)。同じシードなら同じ列になる
function createRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// チャートの縦軸の範囲。全部同じ値でも幅が0にならないようにする
function normalizeRange(values) {
  let min = Math.min(...values);
  let max = Math.max(...values);
  if (max - min < 1e-9) {
    min -= 1;
    max += 1;
  }
  const pad = (max - min) * 0.05;
  return { min: min - pad, max: max + pad };
}

const SERIES_LENGTH = 120;
const CONTINUATION_LENGTH = 30;
const SERIES_NOISE = 1.2;
const NOISE_PERSISTENCE = 0.85;
const CONTINUATION_MOVE = 15;
const MA_SHORT = 10;
const MA_MID = 30;
const MA_LONG = 60;

function round2(v) {
  return Math.round(v * 100) / 100;
}

function findPattern(id) {
  const p = PATTERNS.find((x) => x.id === id);
  if (!p) throw new Error(`パターンが見つからない: ${id}`);
  return p;
}

// 骨格の点を通る、なめらかな補間。山と谷の高さをはみ出さない(単調3次エルミート)
function makeSpline(points) {
  const n = points.length;
  const xs = points.map((p) => p[0]);
  const ys = points.map((p) => p[1]);
  const d = [];
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  const m = new Array(n);
  m[0] = d[0];
  m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i];
    const b = m[i + 1] / d[i];
    const s = a * a + b * b;
    if (s > 9) {
      const t = 3 / Math.sqrt(s);
      m[i] = t * a * d[i];
      m[i + 1] = t * b * d[i];
    }
  }
  return function (t) {
    if (t <= xs[0]) return ys[0];
    if (t >= xs[n - 1]) return ys[n - 1];
    let i = 0;
    while (t > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i];
    const u = (t - xs[i]) / h;
    const u2 = u * u;
    const u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * ys[i] + (u3 - 2 * u2 + u) * h * m[i]
      + (-2 * u3 + 3 * u2) * ys[i + 1] + (u3 - u2) * h * m[i + 1];
  };
}

function generateSeries(pattern, seed) {
  const rng = createRng(seed);
  const spline = makeSpline(pattern.points);
  const values = [];
  let prev = 0;
  for (let i = 0; i < SERIES_LENGTH; i++) {
    const base = spline(i / (SERIES_LENGTH - 1));
    prev = NOISE_PERSISTENCE * prev + (rng() - 0.5) * SERIES_NOISE;
    values.push(round2(base + prev));
  }
  return values;
}

// 値動き予想の続き。方向は必ず outlook に一致させる
function generateContinuation(lastValue, outlook, seed) {
  const rng = createRng(seed + 7919);
  const move = outlook === 'up' ? CONTINUATION_MOVE : outlook === 'down' ? -CONTINUATION_MOVE : 0;
  const values = [];
  let prev = 0;
  for (let i = 0; i < CONTINUATION_LENGTH; i++) {
    const base = lastValue + (move * (i + 1)) / CONTINUATION_LENGTH;
    prev = NOISE_PERSISTENCE * prev + (rng() - 0.5) * SERIES_NOISE;
    values.push(round2(base + prev));
  }
  return values;
}

function movingAverage(values, window) {
  return values.map((_, i) => {
    if (i < window - 1) return null;
    let sum = 0;
    for (let j = i - window + 1; j <= i; j++) sum += values[j];
    return round2(sum / window);
  });
}
const QUESTION_TEXT = {
  pattern: 'このチャートの形の名前は?',
  outlook: 'この後、株価はどう動きやすい?',
  candle: 'このローソク足の名前は?',
};

// 2つの id が、紛らわしい組(CONFUSABLE_PAIRS)かどうか(順不同)
function isConfusable(a, b) {
  return CONFUSABLE_PAIRS.some(([x, y]) => (x === a && y === b) || (x === b && y === a));
}

// correct 以外から count 個を、シャッフルして選ぶ(紛らわしい組は除く)
function pickOthers(items, correct, count, rng) {
  return shuffle(items.filter((x) => x !== correct && !isConfusable(x.id, correct.id)), rng).slice(0, count);
}

function makePatternQuestion(pattern, seed) {
  const rng = createRng(seed + 1);
  const others = pickOthers(PATTERNS, pattern, 3, rng).map((p) => p.name);
  return {
    id: `pattern:${pattern.id}`,
    type: 'pattern',
    patternId: pattern.id,
    patternName: pattern.name,
    seed,
    question: QUESTION_TEXT.pattern,
    choices: shuffle([pattern.name, ...others], rng),
    answer: pattern.name,
    explanation: pattern.explanation,
    difficulty: pattern.difficulty,
  };
}

function makeOutlookQuestion(pattern, seed) {
  return {
    id: `outlook:${pattern.id}`,
    type: 'outlook',
    patternId: pattern.id,
    patternName: pattern.name,
    seed,
    question: QUESTION_TEXT.outlook,
    choices: OUTLOOK_CHOICES.slice(),
    answer: OUTLOOK_LABELS[pattern.outlook],
    outlook: pattern.outlook,
    explanation: pattern.explanation,
    difficulty: pattern.difficulty,
  };
}

function makeCandleQuestion(candle, rng) {
  const others = pickOthers(CANDLE_PATTERNS, candle, 3, rng).map((c) => c.name);
  return {
    id: `candle:${candle.id}`,
    type: 'candle',
    candles: candle.candles,
    question: QUESTION_TEXT.candle,
    choices: shuffle([candle.name, ...others], rng),
    answer: candle.name,
    explanation: candle.explanation,
    difficulty: candle.difficulty,

}

function makeTermQuestion(term, rng) {
  return {
    id: `term:${term.id}`,
    type: 'term',
    question: term.question,
    choices: shuffle([term.answer, ...term.wrongs], rng),
    answer: term.answer,
    explanation: term.explanation,
    difficulty: term.difficulty,
  };
}

// 問題に不備があればその説明を、なければ null を返す
function validateQuestion(q) {
  if (!['pattern', 'outlook', 'candle', 'term'].includes(q.type)) return `type が不正: ${q.type}`;
  if (!q.id || !q.question || !q.explanation) return `${q.id}: 必須項目がない`;
  const expected = q.type === 'outlook' ? 3 : 4;
  if (q.choices.length !== expected) return `${q.id}: 選択肢が${expected}個ではない`;
  if (new Set(q.choices).size !== q.choices.length) return `${q.id}: 選択肢が重複している`;
  if (q.choices.filter((c) => c === q.answer).length !== 1) return `${q.id}: 正解がちょうど1つ含まれていない`;
  if (!DIFFICULTY_LEVELS.includes(q.difficulty)) return `${q.id}: difficulty が不正: ${q.difficulty}`;
  return null;
}

function chartForQuestion(q) {
  if (q.type === 'term') return null;
  if (q.type === 'candle') return { kind: 'candles', candles: q.candles };
  const pattern = findPattern(q.patternId);
  const values = generateSeries(pattern, q.seed);
  const chart = { kind: 'line', values };
  if (pattern.ma) {
    chart.ma = {
      short: movingAverage(values, MA_SHORT),
      mid: movingAverage(values, MA_MID),
      long: movingAverage(values, MA_LONG),
    };
  }
  if (q.type === 'outlook') {
    chart.continuation = generateContinuation(values[values.length - 1], pattern.outlook, q.seed);
  }
  return chart;
}

const ROUND_SIZE = 10;

function starsOf(level) {
  return DIFFICULTY_LABELS[level];
}

function starsAria(level) {
  return `難易度 星${DIFFICULTY_LEVELS.indexOf(level) + 1}つ(5段階)`;
}

// difficulty が 'all' なら全部、それ以外はその難易度の項目だけ
function byDifficulty(items, difficulty) {
  return difficulty === 'all' ? items : items.filter((x) => x.difficulty === difficulty);
}

function buildPool(mode, rng, difficulty = 'all') {
  const wants = (type) => mode === 'all' || mode === type;
  const pool = [];
  // 乱数は、絞り込みに関係なくパターンごとに同じ回数だけ引く(同じシードなら同じ結果にするため)
  if (mode === 'all') {
    // 同じ形の「名前」と「値動き」を両方出すと、片方の解説がもう片方の答えになるので、どちらか一方だけにする
    for (const p of PATTERNS) {
      const seed = Math.floor(rng() * 1e9);
      const asPattern = rng() < 0.5 || p.outlookQuiz === false;
      if (difficulty !== 'all' && p.difficulty !== difficulty) continue;
      pool.push(asPattern ? makePatternQuestion(p, seed) : makeOutlookQuestion(p, seed));
    }
  } else {
    if (wants('pattern')) {
      for (const p of PATTERNS) {
        const seed = Math.floor(rng() * 1e9);
        if (difficulty === 'all' || p.difficulty === difficulty) pool.push(makePatternQuestion(p, seed));
      }
    }
    if (wants('outlook')) {
      for (const p of PATTERNS) {
        const seed = Math.floor(rng() * 1e9);
        if (p.outlookQuiz !== false && (difficulty === 'all' || p.difficulty === difficulty)) {
          pool.push(makeOutlookQuestion(p, seed));
        }
      }
    }
  }
  if (wants('candle')) {
    for (const c of byDifficulty(CANDLE_PATTERNS, difficulty)) pool.push(makeCandleQuestion(c, rng));
  }
  if (wants('term')) {
    for (const t of byDifficulty(TERMS, difficulty)) pool.push(makeTermQuestion(t, rng));
  }
  return pool;
}

function buildDeck(mode, seed, difficulty = 'all') {
  const rng = createRng(seed);
  return shuffle(buildPool(mode, rng, difficulty), rng).slice(0, ROUND_SIZE);
}

// そのモード・難易度の1ラウンドの問題数(問題の数は乱数に依存しない)
function roundSize(mode, difficulty = 'all') {
  return Math.min(ROUND_SIZE, buildPool(mode, createRng(1), difficulty).length);
}

// 選択肢の並びだけを入れ替えた新しい問題を返す(元の問題は変えない)。outlook は固定順
function reshuffleChoices(q, rng) {
  if (q.type === 'outlook') return { ...q, choices: q.choices.slice() };
  return { ...q, choices: shuffle(q.choices, rng) };
}

// 間違えた問題だけを、deck の並びのまま、選択肢を入れ替えて取り出す
function buildRetryDeck(deck, results, seed) {
  const wrongIds = new Set(results.filter((r) => !r.correct).map((r) => r.id));
  return deck.filter((q) => wrongIds.has(q.id)).map((q, i) => reshuffleChoices(q, createRng(seed + i)));
}

function judge(q, choice) {
  return choice === q.answer;
}

function summarizeRound(results) {
  return {
    total: results.length,
    correct: results.filter((r) => r.correct).length,
    wrong: results.filter((r) => !r.correct),
  };
}

// 成績の保存キー。難易度が all ならモード名そのまま、それ以外は「モード名:難易度」
function statsKey(mode, difficulty = 'all') {
  return difficulty === 'all' ? mode : `${mode}:${difficulty}`;
}

const STATS_KEYS = DIFFICULTY_FILTERS.flatMap((d) => MODES.map((m) => statsKey(m, d)));

function defaultStats() {
  const stats = { best: {}, played: {} };
  for (const m of STATS_KEYS) {
    stats.best[m] = 0;
    stats.played[m] = { correct: 0, total: 0 };
  }
  return stats;
}

// key は statsKey() の値(古い呼び方のモード名もそのまま使える)
function updateStats(stats, mode, correct, total) {
  const next = JSON.parse(JSON.stringify(stats));
  next.best[mode] = Math.max(next.best[mode], correct);
  next.played[mode].correct += correct;
  next.played[mode].total += total;
  return next;
}

// localStorage の文字列から読み込む。壊れていても、正しい部分だけ使って続行する
function parseStats(text) {
  const stats = defaultStats();
  let raw;
  try {
    raw = JSON.parse(text);
  } catch (e) {
    return stats;
  }
  if (!raw || typeof raw !== 'object') return stats;
  for (const m of STATS_KEYS) {
    const best = raw.best && raw.best[m];
    const played = raw.played && raw.played[m];
    if (Number.isFinite(best) && best >= 0) stats.best[m] = best;
    if (
      played &&
      Number.isFinite(played.correct) &&
      Number.isFinite(played.total) &&
      played.correct >= 0 &&
      played.total >= played.correct
    ) {
      stats.played[m] = { correct: played.correct, total: played.total };
    }
  }
  return stats;
}

function formatShareText(mode, correct, total, difficulty = 'all') {
  const label = difficulty === 'all' ? MODE_LABELS[mode] : `${MODE_LABELS[mode]}・${DIFFICULTY_LABELS[difficulty]}`;
  return `株クイズ(${label})で ${total}問中${correct}問正解!`;
}

// ==LOGIC-END==

// ==UI-START==
const STORAGE_KEY = 'stockQuiz.stats.v1';
const app = document.getElementById('app');
let stats = loadStats();
let game = null;
let difficulty = 'all'; // スタート画面で選んだ難易度(ページを開いているあいだは保つ)
let redraw = null;

function loadStats() {
  try {
    return parseStats(localStorage.getItem(STORAGE_KEY));
  } catch (e) {
    return defaultStats();
  }
}

function saveStats() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
  } catch (e) {
    // 保存できなくても、ゲームはそのまま続ける
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function starsBadge(level) {
  return `<span class="stars" role="img" aria-label="${starsAria(level)}">${starsOf(level)}</span>`;
}

// 「← トップに戻る」とその確認(画面の中に出す。window.confirm は使わない)
let leaving = false; // 確認を出している間は true(このあいだ、選択肢や「次の問題へ」は答えにしない)
let confirmAt = 0;
function leaveSlot() {
  return '<div class="leave" id="leave-slot"><button class="link" id="leave">← トップに戻る</button></div>';
}

function bindLeave() {
  leaving = false;
  const slot = document.getElementById('leave-slot');
  const showLink = () => {
    leaving = false;
    slot.innerHTML = '<button class="link" id="leave">← トップに戻る</button>';
    const link = document.getElementById('leave');
    link.addEventListener('click', showConfirm);
    return link;
  };
  const showConfirm = () => {
    leaving = true;
    slot.innerHTML = `<div class="confirm" role="group" aria-label="トップに戻る確認">
      <p>今のラウンドは途中でやめるよ。トップに戻っていい?</p>
      <div class="row"><button id="leave-ok">やめてトップへ</button><button id="leave-cancel">続ける</button></div></div>`;
    // ダブルクリックの2回目が確認のボタンに当たらないようにする
    const ok = () => { if (performance.now() - confirmAt >= CLICK_GUARD_MS) { leaving = false; showStart(); } };
    const cancel = () => {
      if (performance.now() - confirmAt < CLICK_GUARD_MS) return;
      showLink().focus();
      shownAt = performance.now(); // 確認が閉じて内容が上にずれるので、2回目のクリックが選択肢に当たらないようにする
    };
    document.getElementById('leave-ok').addEventListener('click', ok);
    document.getElementById('leave-cancel').addEventListener('click', cancel);
    confirmAt = performance.now();
    document.getElementById('leave-cancel').focus();
  };
  document.getElementById('leave').addEventListener('click', showConfirm);
}

function header() {
  const done = game.results.length;
  const correct = game.results.filter((r) => r.correct).length;
  return `${leaveSlot()}<div class="head"><span>${game.retry ? 'やり直し ' : ''}問題 ${Math.min(game.index + 1, game.deck.length)} / ${game.deck.length}</span>${starsBadge(game.deck[Math.min(game.index, game.deck.length - 1)].difficulty)}<span>正解 ${correct}</span></div>
    <div class="bar"><div style="width:${(done / game.deck.length) * 100}%"></div></div>`;
}

// ---- チャートの描画 ----
function drawLines(ctx, w, h, chart, reveal, colors) {
  const cont = chart.continuation || [];
  const all = chart.values.concat(cont);
  // 続きの方向を軸でほのめかさないよう、最後の値を中心に上下対称な範囲にする
  const lastValue = chart.values[chart.values.length - 1];
  const { min, max } = normalizeRange(all.concat(cont.map((v) => 2 * lastValue - v)));
  const n = all.length;
  const right = chart.ma ? 22 : 8; // 移動平均線の名前を右端に書くための余白
  const x = (i) => 8 + (i / (n - 1)) * (w - 8 - right);
  const y = (v) => h - 12 - ((v - min) / (max - min)) * (h - 24);
  const stroke = (pts, color, width, dash) => {
    ctx.beginPath();
    // 点の中点を通る2次曲線でなめらかにつなぐ
    const valid = pts.filter(([, v]) => v !== null);
    valid.forEach(([i, v], k) => {
      if (k === 0) ctx.moveTo(x(i), y(v));
      else if (k === valid.length - 1) ctx.lineTo(x(i), y(v));
      else {
        const [pi, pv] = valid[k - 1];
        ctx.quadraticCurveTo(x(pi), y(pv), (x(pi) + x(i)) / 2, (y(pv) + y(v)) / 2);
      }
    });
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.setLineDash(dash || []);
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.setLineDash([]);
  };
  if (chart.ma) {
    const lines = [
      ['長', chart.ma.long, colors.long],
      ['中', chart.ma.mid, colors.mid],
      ['短', chart.ma.short, colors.short],
    ];
    for (const [, series, color] of lines) stroke(series.map((v, i) => [i, v]), color, 1.5);
    // 各線の右端のそばに、その線の名前を同じ色で小さく書く
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    for (const [label, series, color] of lines) {
      const last = series.length - 1;
      ctx.fillStyle = color;
      ctx.fillText(label, x(last) + 4, y(series[last]));
    }
  }
  stroke(chart.values.map((v, i) => [i, v]), colors.line, 2.5);
  if (reveal && cont.length) {
    const start = chart.values.length - 1;
    stroke([[start, chart.values[start]], ...cont.map((v, i) => [start + 1 + i, v])], colors.cont, 2.5, [6, 4]);
  }
}

function drawCandles(ctx, w, h, candles, colors) {
  const { min, max } = normalizeRange(candles.flatMap((c) => [c.h, c.l]));
  const y = (v) => h - 12 - ((v - min) / (max - min)) * (h - 24);
  const slot = w / candles.length;
  const bodyW = Math.min(56, slot * 0.4);
  candles.forEach((c, i) => {
    const cx = slot * (i + 0.5);
    const color = c.c >= c.o ? colors.up : colors.down;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, y(c.h));
    ctx.lineTo(cx, y(c.l));
    ctx.stroke();
    const top = y(Math.max(c.o, c.c));
    const bottom = y(Math.min(c.o, c.c));
    ctx.fillRect(cx - bodyW / 2, top, bodyW, Math.max(2, bottom - top));
  });
}

function renderChart(canvas, chart, reveal) {
  const css = getComputedStyle(document.documentElement);
  const get = (name) => css.getPropertyValue(name).trim();
  const colors = {
    line: get('--line'), short: get('--ma-short'), mid: get('--ma-mid'), long: get('--ma-long'),
    up: get('--up'), down: get('--down'), cont: get('--cont'),
  };
  const w = canvas.parentElement.clientWidth - 16;
  const h = Math.round(w * 0.55);
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = `${w}px`;
  canvas.style.height = `${h}px`;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  if (chart.kind === 'candles') drawCandles(ctx, w, h, chart.candles, colors);
  else drawLines(ctx, w, h, chart, reveal, colors);
}

// 移動平均線がある図には、色の説明を添える
function maNote(q) {
  if (q.type === 'term' || q.type === 'candle' || !findPattern(q.patternId).ma) return '';
  return `<p class="note">橙の線が短期(${MA_SHORT}本)、緑の線が中期(${MA_MID}本)、紫の線が長期(${MA_LONG}本)の移動平均線だよ。</p>`;
}

function drawQuestionChart(q, reveal) {
  const canvas = document.getElementById('chart');
  const chart = chartForQuestion(q);
  redraw = () => renderChart(canvas, chart, reveal);
  redraw();
  // 描画後に縦スクロールバーが出ると幅が変わるので、もう一度描き直す
  requestAnimationFrame(() => { if (redraw) redraw(); });
}

window.addEventListener('resize', () => { if (redraw) redraw(); });

// ---- 画面 ----
function showStart() {
  redraw = null;
  const rows = MODES.map((m) => {
    const key = statsKey(m, difficulty);
    const size = roundSize(m, difficulty);
    const p = stats.played[key];
    const rate = p.total ? `${Math.round((p.correct / p.total) * 100)}%` : '-';
    if (size === 0) {
      return `<button class="choice" data-mode="${m}" aria-disabled="true">${MODE_LABELS[m]}<small>この難易度の問題は、まだないよ</small></button>`;
    }
    return `<button class="choice" data-mode="${m}">${MODE_LABELS[m]}<small>最高 ${stats.best[key]} / ${size}　正解率 ${rate}　${size}問</small></button>`;
  }).join('');
  const diffs = DIFFICULTY_FILTERS.map((d) =>
    `<button data-diff="${d}" aria-pressed="${d === difficulty}" aria-label="${d === 'all' ? 'すべて' : starsAria(d)}">${DIFFICULTY_LABELS[d]}</button>`).join('');
  app.innerHTML = `<h1>株クイズ</h1>
    <p class="lead">チャートの形、値動き、ローソク足、用語をクイズで学ぼう。1回 ${ROUND_SIZE} 問だよ(難易度で絞ると、少なくなることがあるよ)。</p>
    <p class="sec">難易度</p>
    <div class="diffs">${diffs}</div>
    <div class="choices">${rows}</div>`;
  app.querySelectorAll('[data-diff]').forEach((b) => b.addEventListener('click', () => {
    difficulty = b.dataset.diff;
    showStart();
    const again = app.querySelector(`[data-diff="${difficulty}"]`);
    if (again) again.focus(); // 描き直したあとも、押したボタンにフォーカスを戻す
  }));
  // 結果画面の「トップへ戻る」のダブルクリックの2回目で、ラウンドが始まらないようにする
  app.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', guarded(() => { if (b.getAttribute('aria-disabled') !== 'true') startGame(b.dataset.mode); })));
  shownAt = performance.now();
}

function startGame(mode) {
  game = { mode, difficulty, deck: buildDeck(mode, Date.now() % 2147483647, difficulty), index: 0, results: [] };
  showQuestion();
}

// 画面を描いた直後のクリック(ダブルクリックの2回目)は無視する
const CLICK_GUARD_MS = 400;
let shownAt = 0;
function guarded(fn) {
  return (...args) => {
    if (performance.now() - shownAt < CLICK_GUARD_MS) return;
    fn(...args);
  };
}

function showQuestion() {
  const q = game.deck[game.index];
  const hasChart = q.type !== 'term';
  app.innerHTML = `${header()}
    <p class="q">${esc(q.question)}</p>
    ${hasChart ? '<div class="chart"><canvas id="chart"></canvas></div>' : ''}
    ${q.type === 'candle' ? '<p class="note">赤が陽線(上昇)、青が陰線(下落)だよ。</p>' : ''}
    ${maNote(q)}
    <div class="choices">${q.choices.map((c, i) => `<button class="choice" data-i="${i}">${esc(c)}</button>`).join('')}</div>`;
  if (hasChart) drawQuestionChart(q, false);
  else redraw = null;
  bindLeave();
  app.querySelectorAll('[data-i]').forEach((b) =>
    b.addEventListener('click', guarded(() => { if (!leaving) answer(q, q.choices[Number(b.dataset.i)]); })));
  shownAt = performance.now();
}

function answer(q, picked) {
  const correct = judge(q, picked);
  game.results.push({ id: q.id, question: q.question, answer: q.answer, picked, correct, difficulty: q.difficulty });
  showExplain(q, picked, correct);
}

function showExplain(q, picked, correct) {
  const hasChart = q.type !== 'term';
  const last = game.index === game.deck.length - 1;
  const shape = q.type === 'outlook' ? `<p class="sub">チャートの形: ${esc(q.patternName)}</p>` : '';
  app.innerHTML = `${header()}
    <div class="result ${correct ? 'good' : 'bad'}">
      <p class="label">${correct ? '正解!' : '不正解… 正しい答えは'}</p>
      <p class="answer">${esc(q.answer)}</p>
      <p class="exp">${esc(q.explanation)}</p>
    </div>
    ${shape}
    ${hasChart ? '<div class="chart"><canvas id="chart"></canvas></div>' : ''}
    ${maNote(q)}
    <p class="sub">あなたの答え: ${esc(picked)}(${correct ? '正解' : '不正解'})</p>
    <button class="primary" id="next">${last ? '結果を見る' : '次の問題へ'}</button>`;
  if (hasChart) drawQuestionChart(q, true);
  else redraw = null;
  bindLeave();
  document.getElementById('next').addEventListener('click', guarded(() => { if (!leaving) next(); }));
  shownAt = performance.now();
}

function next() {
  game.index += 1;
  if (game.index >= game.deck.length) finish();
  else showQuestion();
}

function finish() {
  const summary = summarizeRound(game.results);
  if (!game.retry) { // やり直しは最高スコアにも正解率にも入れない
    stats = updateStats(stats, statsKey(game.mode, game.difficulty), summary.correct, summary.total);
    saveStats();
  }
  showResult(summary);
}

function showResult(summary) {
  redraw = null;
  const wrong = summary.wrong.map((r) =>
    `<li>${starsBadge(r.difficulty)}${esc(r.question)} 正解: ${esc(r.answer)}(あなたの答え: ${esc(r.picked)})</li>`).join('');
  const retryLabel = game.retry ? 'まだ間違えた問題をやり直す' : '間違えた問題だけやり直す';
  const retryBtn = summary.wrong.length
    ? `<button class="primary" id="retry">${retryLabel}(${summary.wrong.length}問)</button>` : '';
  app.innerHTML = `<h1>${game.retry ? 'やり直しの結果' : '結果'}</h1>
    ${game.retry ? '<p class="note">やり直しの結果は、最高スコアと正解率には入らないよ。</p>' : ''}
    <p class="score">${summary.correct} / ${summary.total}</p>
    ${wrong ? `<p class="q">間違えた問題</p><ul class="wrong">${wrong}</ul>` : '<p class="lead">全問正解だよ。</p>'}
    <div class="actions">
      ${retryBtn}
      <button class="${retryBtn ? '' : 'primary'}" id="again">${game.retry ? '新しいラウンドを始める' : 'もう一度'}</button>
      ${game.retry ? '' : '<button id="copy">結果をコピー</button>'}
      <button id="top">トップへ戻る</button>
    </div>
    <p class="note" id="copy-note"></p>`;
  const retryEl = document.getElementById('retry');
  if (retryEl) retryEl.addEventListener('click', guarded(() => {
    game = { mode: game.mode, difficulty: game.difficulty, deck: buildRetryDeck(game.deck, game.results, Date.now() % 2147483647),
      index: 0, results: [], retry: true };
    showQuestion();
  }));
  document.getElementById('again').addEventListener('click', guarded(() => startGame(game.mode)));
  shownAt = performance.now(); // 直前のダブルクリックの2回目で、やり直しや新ラウンドが始まらないようにする
  document.getElementById('top').addEventListener('click', showStart);
  const copyEl = document.getElementById('copy');
  if (copyEl) copyEl.addEventListener('click', () =>
    copyResult(formatShareText(game.mode, summary.correct, summary.total, game.difficulty)));
}

async function copyResult(text) {
  const note = document.getElementById('copy-note');
  try {
    await navigator.clipboard.writeText(text);
    note.textContent = 'コピーしたよ。';
  } catch (e) {
    note.textContent = `コピーできなかったよ。次の文を手でコピーしてね: ${text}`;
  }
}

showStart();
// ==UI-END==
</script>
